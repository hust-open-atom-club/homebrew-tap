name: Update atomgit-cli Formula

on:
  workflow_dispatch:
  schedule:
    # Check hourly while avoiding the busiest time at the top of the hour.
    - cron: "20 * * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-atomgit-cli-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Test Formula updater
        run: python3 -m unittest discover -s tests

      - name: Update Formula metadata
        id: update
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_formula.py

          version="$(ruby -ne 'puts Regexp.last_match(1) if /^\s*version "([^"]+)"/' Formula/atomgit-cli.rb)"
          commit="$(ruby -ne 'puts Regexp.last_match(1) if /^\s*revision: "([0-9a-f]{40})"/' Formula/atomgit-cli.rb)"
          {
            if git diff --quiet -- Formula/atomgit-cli.rb; then
              echo "changed=false"
            else
              echo "changed=true"
              echo "version=$version"
              echo "commit=$commit"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Validate Formula syntax and style
        if: steps.update.outputs.changed == 'true'
        run: brew test-bot --only-tap-syntax

      - name: Create update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
          COMMIT: ${{ steps.update.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          short_commit="${COMMIT:0:12}"
          branch="automation/update-atomgit-cli-${short_commit}"
          title="chore: update atomgit-cli to ${short_commit}"

          # Ensure Git uses this step's GITHUB_TOKEN even if checkout's
          # temporary credentials are unavailable.
          gh auth setup-git --hostname github.com --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/atomgit-cli.rb
          git commit -m "$title"

          body="$(printf '%s\n\n%s\n%s\n%s\n' \
            'Automated update from the latest AtomGit main commit.' \
            "- Pinned the Formula to commit \`${COMMIT}\`." \
            "- Updated the development version to \`${VERSION}\`." \
            '- Automatically squash-merges after the macOS and Linux CI passes.')"
          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            pr_url="$(gh pr view "$existing_pr" --json url --jq '.url')"
            remote_head_sha="$(gh pr view "$existing_pr" --json headRefOid --jq '.headRefOid')"
            existing_changed_files="$(gh pr diff "$pr_url" --name-only)"
            if [[ "$existing_changed_files" != "Formula/atomgit-cli.rb" ]]; then
              echo "Refusing to update a PR that changes files other than the Formula" >&2
              printf '%s\n' "$existing_changed_files" >&2
              exit 1
            fi

            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            if [[ "$(git rev-parse "origin/${branch}")" != "$remote_head_sha" ]]; then
              echo "Pull request head changed while preparing the update" >&2
              exit 1
            fi

            if git diff --quiet "origin/${branch}" HEAD -- Formula/atomgit-cli.rb; then
              echo "Reusing pull request #${existing_pr}; its Formula is current"
              head_sha="$remote_head_sha"
            else
              echo "Updating pull request #${existing_pr} with the generated Formula"
              desired_formula="${RUNNER_TEMP}/atomgit-cli-${short_commit}.rb"
              cp Formula/atomgit-cli.rb "$desired_formula"
              git checkout -B "$branch" "origin/${branch}"
              cp "$desired_formula" Formula/atomgit-cli.rb
              git add Formula/atomgit-cli.rb
              git commit -m "$title"
              git push origin "$branch"
              head_sha="$(git rev-parse HEAD)"
              gh pr edit "$pr_url" --title "$title" --body "$body"
            fi
          else
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
              if ! git diff --quiet "origin/${branch}" HEAD -- Formula/atomgit-cli.rb; then
                echo "Remote branch ${branch} contains unexpected Formula content" >&2
                exit 1
              fi
              echo "Remote branch ${branch} already exists; creating its pull request"
            else
              git push origin "HEAD:refs/heads/${branch}"
            fi

            pr_url="$(gh pr create --base main --head "$branch" --title "$title" --body "$body")"
            head_sha="$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')"
          fi

          changed_files="$(gh pr diff "$pr_url" --name-only)"
          if [[ "$changed_files" != "Formula/atomgit-cli.rb" ]]; then
            echo "Refusing to merge a PR that changes files other than the Formula" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi

          gh workflow run test.yml --ref "$branch"

          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list \
              --workflow test.yml \
              --commit "$head_sha" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for the Formula CI run to start" >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          gh pr merge "$pr_url" \
            --squash \
            --delete-branch \
            --match-head-commit "$head_sha"
