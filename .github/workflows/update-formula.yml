name: Update atomgit-cli Formula

on:
  workflow_dispatch:
  schedule:
    # Match the Scoop bucket cadence while avoiding the top of the hour.
    - cron: "20 */4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-atomgit-cli-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Update Formula metadata
        id: update
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_formula.py

          version="$(ruby -ne 'puts Regexp.last_match(1) if /^\s*version "([^"]+)"/' Formula/atomgit-cli.rb)"
          if git diff --quiet -- Formula/atomgit-cli.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Formula syntax and style
        if: steps.update.outputs.changed == 'true'
        run: brew test-bot --only-tap-syntax

      - name: Create update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/update-atomgit-cli-v${VERSION}"
          title="chore: update atomgit-cli to v${VERSION}"

          # Ensure Git uses this step's GITHUB_TOKEN even if checkout's
          # temporary credentials are unavailable.
          gh auth setup-git --hostname github.com --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/atomgit-cli.rb
          git commit -m "$title"

          existing_pr="$(gh pr list --head "$branch" --state all --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Pull request #${existing_pr} already exists"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            if ! git diff --quiet "origin/${branch}" HEAD -- Formula/atomgit-cli.rb; then
              echo "Remote branch ${branch} contains unexpected Formula content" >&2
              exit 1
            fi
            echo "Remote branch ${branch} already exists; creating its pull request"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          body="$(printf '%s\n\n%s\n%s\n' \
            'Automated update from the latest stable AtomGit release.' \
            '- Updated the Formula version and all four platform URLs.' \
            '- Downloaded every release archive and recalculated its SHA-256.')"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
